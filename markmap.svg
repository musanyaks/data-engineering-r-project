markmap-node" transform="translate(518, 17.09375)"><line stroke="#17becf" stroke-width="1.375" x1="-1" x2="182" y1="20.6875" y2="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="164" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml"><a href="#development-workflow">Development Workflow</a></div></div></foreignObject></g><g data-depth="2" data-path="1.2" class="markmap-node" transform="translate(297, -180.71875)"><line stroke="#ff7f0e" stroke-width="1.75" x1="-1" x2="143" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#ff7f0e" fill="var(--markmap-circle-open-bg)" cx="141" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="125" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Table of Contents</div></div></foreignObject></g><g data-depth="4" data-path="1.19.20.21" class="markmap-node" transform="translate(752, 48.46875)"><line stroke="#2ca02c" stroke-width="1.1875" x1="-1" x2="695" y1="191.59375" y2="191.59375"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="677" height="191"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml"><table data-lines="39,49">
<thead data-lines="39,40">
<tr data-lines="39,40">
<th>Feature</th>
<th>Description</th>
</tr>
</thead>
<tbody data-lines="41,49">
<tr data-lines="41,42">
<td>Out-of-core processing</td>
<td>Handles files larger than 4GB RAM via DuckDB disk streaming</td>
</tr>
<tr data-lines="42,43">
<td>Incremental builds</td>
<td><code>targets</code> skips unchanged files; only reprocesses what is new</td>
</tr>
<tr data-lines="43,44">
<td>Data validation</td>
<td>Schema checks, null constraints, range checks, uniqueness</td>
</tr>
<tr data-lines="44,45">
<td>Memory monitoring</td>
<td>Logs RAM usage at every pipeline stage</td>
</tr>
<tr data-lines="45,46">
<td>Structured logging</td>
<td>Rotated logs with automatic cleanup to prevent disk overflow</td>
</tr>
<tr data-lines="46,47">
<td>Environment profiles</td>
<td><code>dev</code> / <code>prod</code> / <code>test</code> configs with different resource limits</td>
</tr>
<tr data-lines="47,48">
<td>Batch loading</td>
<td>Writes to DuckDB in 10K-50K row chunks to stay within memory bounds</td>
</tr>
<tr data-lines="48,49">
<td>Audit trail</td>
<td>Every row gets <code>_loaded_at</code> and <code>_source_file</code> timestamps</td>
</tr>
</tbody>
</table></div></div></foreignObject></g><g data-depth="3" data-path="1.19.20" class="markmap-node" transform="translate(561, 133.96875)"><line stroke="#ff7f0e" stroke-width="1.375" x1="-1" x2="113" y1="20.6875" y2="20.6875"/><circle stroke-width="1.5" r="6" stroke="#ff7f0e" fill="var(--markmap-circle-open-bg)" cx="111" cy="20.6875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="95" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Key Features</div></div></foreignObject></g><g data-depth="2" data-path="1.19" class="markmap-node" transform="translate(297, 133.96875)"><line stroke="#1f77b4" stroke-width="1.75" x1="-1" x2="186" y1="20.875" y2="20.875"/><circle stroke-width="1.5" r="6" stroke="#1f77b4" fill="var(--markmap-circle-open-bg)" cx="184" cy="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="168" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">What This Project Does</div></div></foreignObject></g><g data-depth="2" data-path="1.22" class="markmap-node" transform="translate(297, 160.71875)"><line stroke="#d62728" stroke-width="1.75" x1="-1" x2="103" y1="20.875" y2="20.875"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="85" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Architecture</div></div></foreignObject></g><g data-depth="1" data-path="1" class="markmap-node" transform="translate(0, -10)"><line stroke="#1f77b4" stroke-width="2.5" x1="-1" x2="219" y1="21.25" y2="21.25"/><circle stroke-width="1.5" r="6" stroke="#1f77b4" fill="var(--markmap-circle-open-bg)" cx="217" cy="21.25"/><foreignObject class="markmap-foreign" x="8" y="0" style="opacity: 1;" width="201" height="20"><div xmlns="http://www.w3.org/1999/xhtml"><div xmlns="http://www.w3.org/1999/xhtml">Data Engineering R Pipeline</div></div></foreignObject></g></g></svg>